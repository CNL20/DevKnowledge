version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: devknowledge-postgres
    environment:
      POSTGRES_DB: devknowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devknowledge_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devknowledge-redis
    ports:
      - "6379:6379"

  # seq / grafana / prometheus có thể bổ sung khi bước sang Observability phase

volumes:
  devknowledge_pg_data:
